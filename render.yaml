services:
  - type: web
    name: zefoy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ZEFOY_KEY
        sync: false
      - key: TIKTOK_URL
        sync: false
      - key: ZEFOY_SERVICE
        value: Favorites
      - key: AUTO_START
        value: "false"
